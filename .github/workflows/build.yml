name: Build Kernel

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string

      target:
        required: true
        type: string

      variant:
        required: true
        type: string

jobs:
  build:
    name: "${{ inputs.branch }} • ${{ inputs.target }} • ${{ inputs.variant }}"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      TARGET: ${{ inputs.target }}
      VARIANT: ${{ inputs.variant }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            gh \
            jq \
            libelf-dev \
            libssl-dev \
            lz4 \
            pahole \
            python3 \
            rsync \
            unzip \
            zip

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ inputs.target }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ inputs.target }}
            ccache-${{ runner.os }}

      - name: Prepare scripts
        run: chmod +x scripts/*.sh

      - name: Patch source tree
        run: |
          ./gscripts/patch_sultan.sh "$TARGET" "$VARIANT"

      - name: Build kernel
        run: |
          ./gscripts/build.sh "$TARGET"

      - name: Package AnyKernel
        run: |
          ./gscripts/package.sh "$TARGET" "$VARIANT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan_${{ inputs.branch }}_${{ inputs.target }}_${{ inputs.variant }}
          path: dist/SULTAN17_${{ inputs.target }}_${{ inputs.variant }}.zip
          if-no-files-found: error
          compression-level: 0


      # Sultan uses CONFIG_INTEGRATE_MODULES=y, which explicitly excludes
      # CONFIG_MODULES=y in kernel/module/Kconfig. A loadable PathMask .ko
      # cannot work on that kernel, even if an external build succeeds.
      - name: Check PathMask LKM compatibility
        if: ${{ inputs.branch == '17.0.0-cp3a' }}
        id: pathmask_support
        shell: bash
        run: |
          if grep -qx 'CONFIG_MODULES=y' out/.config; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
            echo "PathMask LKM supported by this kernel config" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=PathMask LKM unavailable::Sultan INTEGRATE_MODULES excludes dynamic MODULES; PathMask is NOT integrated and no PathMask ZIP will be produced."
            echo "### PathMask skipped: Sultan integrated modules are incompatible with loadable .ko" >> "$GITHUB_STEP_SUMMARY"
            echo "A builtin PathMask port or a separately validated loadable-module kernel configuration is required." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build matching PathMask module (cp3a only)
        if: ${{ inputs.branch == '17.0.0-cp3a' && steps.pathmask_support.outputs.supported == 'true' }}
        run: bash ./gscripts/build_pathmask.sh "$TARGET" "$VARIANT"

      - name: Upload PathMask module and KernelSU package (cp3a only)
        if: ${{ inputs.branch == '17.0.0-cp3a' && steps.pathmask_support.outputs.supported == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: PathMask_${{ inputs.branch }}_${{ inputs.target }}_${{ inputs.variant }}
          path: |
            dist/PathMask_${{ inputs.target }}_${{ inputs.variant }}_android14-6.1.ko
            dist/PathMask_${{ inputs.target }}_${{ inputs.variant }}_android14-6.1_procguard.ko
            dist/PathMask_${{ inputs.target }}_${{ inputs.variant }}_android14-6.1_ksu.zip
          if-no-files-found: error
          compression-level: 0
