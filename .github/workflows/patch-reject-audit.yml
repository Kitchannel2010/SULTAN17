name: Audit Patch Rejects (cp3a zuma)

on:
  push:
    branches:
      - 17.0.0-cp3a
    paths:
      - .github/workflows/patch-reject-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply production patches without compiling kernel
        shell: bash
        run: |
          chmod +x gscripts/*.sh
          bash gscripts/patch_sultan.sh zuma ksu-next-susfs-vpnhide
      - name: Audit rejected hunks against final patched source
        if: always()
        shell: bash
        run: |
          mkdir -p patch-audit
          python3 - <<'PY' | tee patch-audit/report.txt
          import pathlib, re
          root = pathlib.Path('.')
          rejects = sorted(p for p in root.rglob('*.rej') if
                           '.git' not in p.parts and 'toolchains' not in p.parts)
          print(f'Total .rej files: {len(rejects)}', flush=True)
          for rej in rejects:
              target = pathlib.Path(str(rej)[:-4])
              diff = rej.read_text(errors='replace')
              source = target.read_text(errors='replace') if target.exists() else ''
              source_lines = {re.sub(r'\s+', '', l) for l in source.splitlines()}
              hunks = re.split(r'(?=^@@ )', diff, flags=re.M)
              hunks = [h for h in hunks if h.startswith('@@ ')]
              print(f'\n### {rej} (target_exists={target.exists()}, hunks={len(hunks)})')
              for hi, h in enumerate(hunks, 1):
                  added = [l[1:] for l in h.splitlines() if l.startswith('+') and not l.startswith('+++')]
                  added = [l for l in added if l.strip() and not l.lstrip().startswith(('*','//','#endif'))]
                  present = [l for l in added if re.sub(r'\s+', '', l) in source_lines]
                  missing = [l for l in added if re.sub(r'\s+', '', l) not in source_lines]
                  print(f' hunk{hi} addition_lines={len(added)} present_exact_normalized={len(present)} missing={len(missing)}')
                  for line in missing[:12]:
                      print('  MISSING: ' + line.strip()[:150])
                  for line in present[:5]:
                      print('  PRESENT: ' + line.strip()[:150])
                  removed = [l[1:] for l in h.splitlines() if l.startswith('-') and not l.startswith('---')]
                  removed = [l for l in removed if len(l.strip()) >= 15 and not l.lstrip().startswith(('*','//'))]
                  still = [l for l in removed if re.sub(r'\s+', '', l) in source_lines]
                  print(f' removed_code_lines={len(removed)} still_in_source={len(still)}')
                  for line in still[:17]:
                      print('  STILL_OLD: ' + line.strip()[:180])
              print('----- RAW REJECT START -----')
              print(diff[:24000])
              print('----- RAW REJECT END -----')
              out = pathlib.Path('patch-audit/rejects') / rej
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(diff)
          PY
      - name: Inspect final hooked source context
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' | tee patch-audit/hook-check.txt
          from pathlib import Path
          checks = {
            'KernelSU-Next/kernel/core/init.c': [
              'susfs_init();', 'ksu_sucompat_init();',
              'ksu_setuid_hook_init();', 'ksu_syscall_hook_init();',
              'ksu_syscall_hook_manager_init();', 'ksu_ksud_init();',
              'ksu_late_loaded', 'ksu_lsm_hook_init();',
            ],
            'KernelSU-Next/kernel/feature/kernel_umount.c': [
              'ksu_uid_should_umount(new_uid)',
              'is_zygote_child',
              'ksu_handle_umount(uid_t old_uid, uid_t new_uid)',
            ],
            'KernelSU-Next/kernel/Kbuild': [
              'hook/syscall_hook_manager.o', 'hook/lsm_hook.o',
              'hook/setuid_hook.o', 'feature/kernel_umount.o',
            ],
            'KernelSU-Next/kernel/hook/setuid_hook.c': [
              'ksu_handle_setresuid(', 'handle_zygote_setresuid(',
              'ksu_handle_extra_susfs_work()', 'susfs_set_current_proc_no_su()',
            ],
            'fs/namespace.c': [
              'susfs_is_current_ksu_domain', 'susfs_sus_mount',
              '#include <linux/susfs_def.h>',
            ],
            'fs/super.c': [
              'susfs_is_current_ksu_domain',
              '#include <linux/susfs_def.h>',
            ],
            'kernel/sys.c': [
              'susfs_spoof_uname(&tmp)',
            ],
            'fs/namei.c': [
              'vpnhide_should_hide_dentry(', 'pathmask_should_hide_inode(',
            ],
            'fs/readdir.c': [
              'vpnhide_readdir_begin(', 'vpnhide_readdir_end(',
              'pathmask_should_hide_dirent(',
            ],
            'fs/stat.c': [
              'vpnhide_should_hide', 'susfs_sus_kstat',
              'pathmask_should_hide_inode(',
            ],
            'fs/nomount/Kconfig': [
              'NOMOUNT',
            ],
          }
          for file, patterns in checks.items():
              p = Path(file)
              src = p.read_text(errors='replace') if p.is_file() else ''
              print(f'### {file}: present={p.is_file()}')
              for pattern in patterns:
                  found = [(i, line.strip()) for i, line in
                           enumerate(src.splitlines(), 1) if pattern in line]
                  print(f' {pattern}: count={len(found)}')
                  for line, text in found[:5]:
                      print(f'   L{line}: {text[:140]}')
          init = Path('KernelSU-Next/kernel/core/init.c')
          if init.is_file():
              s = init.read_text(errors='replace').splitlines()
              for label, start, stop in [
                ('kernelsu_init', 'int __init kernelsu_init(', 'void __exit kernelsu_exit('),
              ]:
                  a = next((i for i,x in enumerate(s) if start in x), -1)
                  b = next((i for i,x in enumerate(s) if stop in x), -1)
                  if a >= 0 and b > a:
                      print(f'### CONTEXT {label}')
                      for i in range(a, min(b, a+170)):
                          print(f' {i+1}: {s[i]}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp3a-reject-diagnostics
          path: patch-audit/
          if-no-files-found: error
          retention-days: 14
